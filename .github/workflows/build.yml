name: Build pbiviz project dependencies bundle

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pbiviz
        run: npm install -g powerbi-visuals-tools

      - name: Create sample project
        run: |
          pbiviz new SampleProject -y
          cd SampleProject
          npm install

      - name: Bundle project dependencies
        run: |
          cd SampleProject
          tar -czf ../project-deps-bundle.tar.gz -C . node_modules package.json package-lock.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-deps-bundle
          path: project-deps-bundle.tar.gz
          retention-days: 7
